function stripHash(hex) {
  return (hex || 'FFFFFF').replace('#', '').toUpperCase();
}

function resolveRockboxTags(str, sampleMode) {
  if (!sampleMode || !str) return str || '';
  let out = str;
  if (out.includes(';') && out.includes('%t(')) {
    out = out.split(';')[0].replace(/%t\([^)]+\)/g, '');
  }
  out = out.replace(/%s/g, '');
  Object.entries(SAMPLE_TAG_MAP).forEach(([k, v]) => {
    out = out.split(k).join(v);
  });
  return out;
}

// Generate authentic Rockbox RB12 binary .fnt file from browser Canvas font rasterizer
function generateRockboxFntBinary(family, px, weight = '400') {
  const firstChar = 32;
  const lastChar = 126;
  const count = lastChar - firstChar + 1;
  const height = Math.max(8, Math.min(64, Math.round(px)));
  const ascent = Math.round(height * 0.8);
  const stripes = Math.ceil(height / 8);

  const canvas = document.createElement('canvas');
  canvas.width = Math.max(32, height * 2);
  canvas.height = height + 4;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  ctx.font = `${weight} ${height}px "${family}", system-ui, sans-serif`;
  ctx.textBaseline = 'alphabetic';

  const glyphBytes = [];
  const offsets = [];
  const widths = [];
  let maxwidth = 0;

  for (let i = 0; i < count; i++) {
    const ch = String.fromCharCode(firstChar + i);
    const m = ctx.measureText(ch);
    const gw = Math.max(1, Math.min(canvas.width, Math.ceil(m.width)));
    if (gw > maxwidth) maxwidth = gw;
    widths.push(gw);
    offsets.push(glyphBytes.length);

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ffffff';
    ctx.font = `${weight} ${height}px "${family}", system-ui, sans-serif`;
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(ch, 0, ascent);
    const img = ctx.getImageData(0, 0, gw, height).data;

    for (let s = 0; s < stripes; s++) {
      for (let x = 0; x < gw; x++) {
        let byte = 0;
        for (let b = 0; b < 8; b++) {
          const y = s * 8 + b;
          if (y < height) {
            const alpha = img[(y * gw + x) * 4 + 3];
            if (alpha >= 110) byte |= (1 << b);
          }
        }
        glyphBytes.push(byte);
      }
    }
  }

  const bitsWords = glyphBytes.length;
  const use32Off = bitsWords >= 65535;
  const padAfterBits = (!use32Off && (bitsWords & 1)) ? 1 : (use32Off && (bitsWords & 3) ? (4 - (bitsWords & 3)) : 0);
  const offTableSize = count * (use32Off ? 4 : 2);
  const headerSize = 32;
  const totalSize = headerSize + bitsWords + padAfterBits + offTableSize + count;

  const buf = new ArrayBuffer(totalSize);
  const dv = new DataView(buf);
  const u8 = new Uint8Array(buf);
  // Magic "RB12"
  u8[0] = 0x52; u8[1] = 0x42; u8[2] = 0x31; u8[3] = 0x32;
  dv.setUint16(4, maxwidth, true);
  dv.setUint16(6, height, true);
  dv.setUint16(8, ascent, true);
  dv.setUint16(10, 0, true); // 1bpp
  dv.setUint32(12, firstChar, true);
  dv.setUint32(16, firstChar, true);
  dv.setUint32(20, count, true);
  dv.setUint32(24, bitsWords, true);
  dv.setUint32(28, count, true);
  // Wait: RB12 header has width_count at 32 -> let's write 36-byte header!
  const buf2 = new ArrayBuffer(36 + bitsWords + padAfterBits + offTableSize + count);
  const dv2 = new DataView(buf2);
  const u8_2 = new Uint8Array(buf2);
  u8_2[0] = 0x52; u8_2[1] = 0x42; u8_2[2] = 0x31; u8_2[3] = 0x32;
  dv2.setUint16(4, maxwidth, true);
  dv2.setUint16(6, height, true);
  dv2.setUint16(8, ascent, true);
  dv2.setUint16(10, 0, true);
  dv2.setUint32(12, firstChar, true);
  dv2.setUint32(16, firstChar, true);
  dv2.setUint32(20, count, true);
  dv2.setUint32(24, bitsWords, true);
  dv2.setUint32(28, count, true);
  dv2.setUint32(32, count, true);
  u8_2.set(glyphBytes, 36);
  let pos = 36 + bitsWords + padAfterBits;
  for (let i = 0; i < count; i++) {
    if (use32Off) { dv2.setUint32(pos, offsets[i], true); pos += 4; }
    else { dv2.setUint16(pos, offsets[i], true); pos += 2; }
  }
  for (let i = 0; i < count; i++) u8_2[pos++] = widths[i];
  return u8_2;
}

// Generate 24-bit uncompressed BMP from a canvas
function canvasToBmp24(canvas) {
  const w = canvas.width, h = canvas.height;
  const ctx = canvas.getContext('2d');
  const img = ctx.getImageData(0, 0, w, h).data;
  const rowBytes = (w * 3 + 3) & ~3;
  const pixelSize = rowBytes * h;
  const buf = new ArrayBuffer(54 + pixelSize);
  const dv = new DataView(buf);
  const u8 = new Uint8Array(buf);
  u8[0] = 0x42; u8[1] = 0x4D; // "BM"
  dv.setUint32(2, 54 + pixelSize, true);
  dv.setUint32(10, 54, true);
  dv.setUint32(14, 40, true);
  dv.setInt32(18, w, true);
  dv.setInt32(22, h, true);
  dv.setUint16(26, 1, true);
  dv.setUint16(28, 24, true);
  dv.setUint32(34, pixelSize, true);
  for (let y = 0; y < h; y++) {
    const srcY = h - 1 - y;
    const dstRow = 54 + y * rowBytes;
    for (let x = 0; x < w; x++) {
      const si = (srcY * w + x) * 4;
      const di = dstRow + x * 3;
      u8[di] = img[si + 2];
      u8[di + 1] = img[si + 1];
      u8[di + 2] = img[si];
    }
  }
  return u8;
}

function generateSpriteBmp(sp) {
  const w = sp.w || 24, h = sp.h || 16, n = sp.subimages || 1;
  const c = document.createElement('canvas');
  c.width = w; c.height = h * n;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#FF00FF'; // Rockbox magenta transparency key
  ctx.fillRect(0, 0, c.width, c.height);
  for (let i = 0; i < n; i++) {
    const y0 = i * h;
    if (sp.presetKind === 'battery') {
      ctx.strokeStyle = '#EAEAEA';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(2, y0 + 2, w - 7, h - 4);
      ctx.fillStyle = '#EAEAEA';
      ctx.fillRect(w - 5, y0 + 5, 3, h - 10);
      const pct = i / Math.max(1, n - 1);
      ctx.fillStyle = pct < 0.2 ? '#EF4444' : '#4ADE80';
      ctx.fillRect(4, y0 + 4, Math.max(2, Math.round((w - 11) * pct)), h - 8);
    } else {
      ctx.fillStyle = '#60A5FA';
      ctx.beginPath();
      ctx.arc(w / 2, y0 + h / 2, Math.min(w, h) * 0.35, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  return canvasToBmp24(c);
}

function generateIconsetBmp() {
  const c = document.createElement('canvas');
  c.width = 16; c.height = 16 * 12;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#FF00FF';
  ctx.fillRect(0, 0, c.width, c.height);
  for (let i = 0; i < 12; i++) {
    ctx.fillStyle = '#93C5FD';
    ctx.fillRect(3, i * 16 + 3, 10, 10);
  }
  return canvasToBmp24(c);
}

    `wps: /.rockbox/wps/${slug}.wps`,
    `sbs: /.rockbox/wps/${slug}.sbs`,
    `fms: /.rockbox/wps/${slug}.fms`,
    `font: /.rockbox/fonts/${c.uiFontFile || '20-Inter.fnt'}`,
    `foreground color: ${stripHash(c.fgColor)}`,
    `background color: ${stripHash(c.bgColor)}`,
    `line selector start color: ${stripHash(c.selStartColor)}`,
    `line selector end color: ${stripHash(c.selEndColor)}`,
    `line selector text color: ${stripHash(c.selTextColor)}`,
    `selector type: ${c.selectorType || 'bar (gradient)'}`,
    `scrollbar: ${c.scrollbar || 'right'}`,
    `show icons: ${c.showIcons || 'on'}`,
    `statusbar: ${c.statusbar || 'off'}`,
    `battery display: ${c.batteryDisplay || 'graphic'}`,
    `volume display: ${c.volumeDisplay || 'graphic'}`,
    `iconset: ${c.iconset && c.iconset !== '-' ? '/.rockbox/icons/' + c.iconset : '-'}`,
    `viewers iconset: ${c.viewersIconset && c.viewersIconset !== '-' ? '/.rockbox/icons/' + c.viewersIconset : '-'}`,
    `backdrop: ${c.backdrop || '-'}`,
    `scroll speed: ${c.scrollSpeed ?? 12}`,
    `scroll delay: ${c.scrollDelay ?? 1200}`,
    `scroll step: ${c.scrollStep ?? 1}`,
  ].join('\n');
}

function wrapCond(condId, inner) {
  if (!condId || condId === 'always') return inner;
  if (condId === 'has_art') return `%?C<${inner}|>`;
  if (condId === 'no_art') return `%?C<|${inner}>`;
  if (condId === 'hold') return `%?mh<${inner}|>`;
  if (condId === 'no_hold') return `%?mh<|${inner}>`;
  if (condId === 'vol_popup') return `%?mv(1.5)<${inner}|>`;
  if (condId === 'charging') return `%?bp<${inner}|>`;
  if (condId === 'playing') return `%?mp<|${inner}>`;
  return inner;
}

function generateSkinFile(screen, project) {
  const lines = [`# Rockbox ${screen.title} — Innioasis Y1 (480x360)`];
  if (screen.disableStatusbar !== false) lines.push('%wd');
  lines.push(project.cfg.backdrop && project.cfg.backdrop !== '-' ? `%X(${project.cfg.backdrop})` : '%X(d)');
  (project.fonts || []).forEach(f => lines.push(`%Fl(${f.id},${f.file})`));

  const sprites = screen.elements.filter(e => !e.hidden && e.type === 'sprite');
  sprites.forEach(sp => {
    lines.push(`%xl(${sp.id},${sp.bmp || 'Sprite.bmp'},0,0,${sp.subimages || 1})`);
  });
  lines.push('');

  const condElems = screen.elements.filter(e => !e.hidden && e.cond && e.cond !== 'always');
  if (condElems.length) {
    lines.push('# --- Conditional Viewport Triggers ---');
    condElems.forEach(el => lines.push(wrapCond(el.cond, `%Vd(${el.id})`)));
    lines.push('');
  }

  screen.elements.forEach(el => {
    if (el.hidden) return;
    const isCond = el.cond && el.cond !== 'always';
    const vTag = isCond ? `%Vl(${el.id},` : `%V(`;
    const vb = el.backdropLayer ? '%VB' : '';
    lines.push(`# ${el.id}`);

    if (el.type === 'rect') {
      lines.push(`${vTag}${el.x},${el.y},${el.w},${el.h},-)${vb}`);
      lines.push(`%dr(0,0,${el.w},${el.h},${stripHash(el.fill)})`);
    } else if (el.type === 'albumart') {
      lines.push(`%Cl(${el.x},${el.y},${el.w},${el.h},${el.halign || 'c'},${el.valign || 'c'})`);
      lines.push(`${vTag}${el.x},${el.y},${el.w},${el.h},-)`);
      lines.push(`%?C<%Cd|>`);
    } else if (el.type === 'progressbar') {
      lines.push(`${vTag}${el.x},${el.y},${el.w},${el.h},-)`);
      lines.push(`%Vf(${stripHash(el.fg)})%Vb(${stripHash(el.bg)})`);
      lines.push(`%pb(0,0,${el.w},${el.h},${el.bmp || '-'})`);
    } else if (el.type === 'sprite') {
      lines.push(`${vTag}${el.x},${el.y},${el.w},${el.h},-)`);
      lines.push(`%xd(${el.id},${el.tag || '%bl'})`);
    } else if (el.type === 'ui_viewport') {
      const fg = el.fg && el.fg !== '-' ? stripHash(el.fg) : '-';
      const bg = el.bg && el.bg !== '-' ? stripHash(el.bg) : '-';
      lines.push(`%Vi(${el.label || '-'},${el.x},${el.y},${el.w},${el.h},${el.fontId ?? 1},${fg},${bg})`);
    } else if (el.type === 'viewport') {
      lines.push(`${vTag}${el.x},${el.y},${el.w},${el.h},${el.fontId ?? 1})${vb}`);
      const fg = el.fg && el.fg !== '-' ? `%Vf(${stripHash(el.fg)})` : '';
      const bg = el.bg && el.bg !== '-' ? `%Vb(${stripHash(el.bg)})` : '';
      if (fg || bg) lines.push(`${fg}${bg}`);
      const align = el.align === 'c' ? '%ac' : (el.align === 'r' ? '%ar' : '%al');
      const rawText = (el.text || '').replace(/^%s/, '');
      lines.push(`${el.scroll ? '%s' : ''}${align}${rawText}`);
    }
  });
  return lines.join('\n');
}

function App() {
  const [project, setProject] = useState(() => {
    try {
      const saved = localStorage.getItem('rb_theme_studio_v4');
      return saved ? JSON.parse(saved) : PRESETS.nugget_dark;
    } catch { return PRESETS.nugget_dark; }
  });
  const [history, setHistory] = useState([]);
  const [redoStack, setRedoStack] = useState([]);
  const [curScreenIdx, setCurScreenIdx] = useState(0);
  const [selElIdx, setSelElIdx] = useState(0);
  const [tool, setTool] = useState('select');
  const [zoom, setZoom] = useState(1.15);
  const [pan, setPan] = useState({ x: 48, y: 44 });
  const [sampleMode, setSampleMode] = useState(true);
  const [simState, setSimState] = useState({ hasArt: true, hold: false, volPopup: false, charging: false, playing: true });
  const [rightTab, setRightTab] = useState('design'); // design | fonts | wps | sbs | fms | cfg
  const [openMenu, setOpenMenu] = useState(null); // file | edit | view | export | help
  const [guides, setGuides] = useState([]);
  const [spaceDown, setSpaceDown] = useState(false);

  const fileInputRef = useRef(null);
  const fontInputRef = useRef(null);
  const dragRef = useRef(null);

  useEffect(() => {
    try { localStorage.setItem('rb_theme_studio_v4', JSON.stringify(project)); } catch {}
  }, [project]);

  const commitProject = useCallback((updater, pushHist = true) => {
    setProject(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      if (pushHist) {
        setHistory(h => [...h.slice(-39), prev]);
        setRedoStack([]);
      }
      return next;
    });
  }, []);

  const undo = useCallback(() => {
    setHistory(h => {
      if (!h.length) return h;
      const prev = h[h.length - 1];
      setRedoStack(r => [...r, project]);
      setProject(prev);
      return h.slice(0, -1);
    });
  }, [project]);

  const redo = useCallback(() => {
    setRedoStack(r => {
      if (!r.length) return r;
      const next = r[r.length - 1];
      setHistory(h => [...h, project]);
      setProject(next);
      return r.slice(0, -1);
    });
  }, [project]);

  const curScreen = project.screens[curScreenIdx] || project.screens[0];
  const selElem = curScreen?.elements[selElIdx] || null;

  const updateElem = useCallback((sIdx, eIdx, patch, pushHist = true) => {
    commitProject(prev => ({
      ...prev,
      screens: prev.screens.map((s, si) => si !== sIdx ? s : {
        ...s,
        elements: s.elements.map((el, ei) => ei === eIdx ? { ...el, ...patch } : el)
      })
    }), pushHist);
  }, [commitProject]);

  const addElement = useCallback((type, x = 40, y = 60) => {
    const scr = project.screens[curScreenIdx];
    const n = scr.elements.length + 1;
    let el = { id: `${type}_${n}`, type, x: Math.round(x), y: Math.round(y), w: 200, h: 28, cond: 'always' };
    if (type === 'viewport') el = { ...el, fontId: 3, fg: '#EAEAEA', bg: '-', align: 'l', scroll: false, text: '%it' };
    else if (type === 'rect') el = { ...el, w: 180, h: 60, fill: '#1B202B', backdropLayer: true };
    else if (type === 'progressbar') el = { ...el, w: 320, h: 12, fg: '#3B82F6', bg: '#252B38', bmp: '-' };
    else if (type === 'albumart') el = { ...el, w: 140, h: 140, halign: 'c', valign: 'c' };
    else if (type === 'sprite') el = { ...el, w: 28, h: 20, bmp: 'Icon.bmp', subimages: 4, tag: '%mp', presetKind: 'play' };
    else if (type === 'ui_viewport') el = { ...el, label: '-', w: 460, h: 300, fontId: 1, fg: '#EAEAEA', bg: '#12151C' };
    commitProject(prev => ({
      ...prev,
      screens: prev.screens.map((s, i) => i === curScreenIdx ? { ...s, elements: [...s.elements, el] } : s)
    }));
    setSelElIdx(scr.elements.length);
    setTool('select');
  }, [project, curScreenIdx, commitProject]);

  const duplicateSelected = useCallback(() => {
    if (!selElem) return;
    const copy = { ...selElem, id: `${selElem.id}_copy`, x: selElem.x + 12, y: selElem.y + 12 };
    commitProject(prev => ({
      ...prev,
      screens: prev.screens.map((s, i) => i === curScreenIdx ? { ...s, elements: [...s.elements, copy] } : s)
    }));
    setSelElIdx(curScreen.elements.length);
  }, [selElem, curScreen, curScreenIdx, commitProject]);

  const deleteSelected = useCallback(() => {
    if (selElIdx < 0 || !selElem) return;
    commitProject(prev => ({
      ...prev,
      screens: prev.screens.map((s, i) => i === curScreenIdx
        ? { ...s, elements: s.elements.filter((_, ei) => ei !== selElIdx) } : s)
    }));
    setSelElIdx(Math.max(0, selElIdx - 1));
  }, [selElIdx, selElem, curScreenIdx, commitProject]);

  const reorderElem = useCallback((dir) => {
    const arr = curScreen.elements;
    const target = selElIdx + dir;
    if (target < 0 || target >= arr.length) return;
    commitProject(prev => ({
      ...prev,
      screens: prev.screens.map((s, i) => {
        if (i !== curScreenIdx) return s;
        const next = [...s.elements];
        [next[selElIdx], next[target]] = [next[target], next[selElIdx]];
        return { ...s, elements: next };
      })
    }));
    setSelElIdx(target);
  }, [curScreen, selElIdx, curScreenIdx, commitProject]);

  useEffect(() => {
    const onKeyDown = (e) => {
      if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName)) return;
      if (e.code === 'Space') { setSpaceDown(true); e.preventDefault(); }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
      else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); }
      else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'd') { e.preventDefault(); duplicateSelected(); }
      else if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteSelected(); }
      else if (e.key.toLowerCase() === 'v') setTool('select');
      else if (e.key.toLowerCase() === 't') setTool('viewport');
      else if (e.key.toLowerCase() === 'r') setTool('rect');
      else if (e.key.toLowerCase() === 'p') setTool('progressbar');
      else if (e.key.toLowerCase() === 'a') setTool('albumart');
      else if (selElem && ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) {
        e.preventDefault();
        const step = e.shiftKey ? 10 : 1;
        const dx = e.key === 'ArrowLeft' ? -step : (e.key === 'ArrowRight' ? step : 0);
        const dy = e.key === 'ArrowUp' ? -step : (e.key === 'ArrowDown' ? step : 0);
        updateElem(curScreenIdx, selElIdx, { x: selElem.x + dx, y: selElem.y + dy });
      }
    };
    const onKeyUp = (e) => { if (e.code === 'Space') setSpaceDown(false); };
    window.addEventListener('keydown', onKeyDown);
    window.addEventListener('keyup', onKeyUp);
    return () => { window.removeEventListener('keydown', onKeyDown); window.removeEventListener('keyup', onKeyUp); };
  }, [undo, redo, duplicateSelected, deleteSelected, selElem, curScreenIdx, selElIdx, updateElem]);

  const startWorkspacePan = (e) => {
    setOpenMenu(null);
    if (e.button === 1 || spaceDown || e.target.dataset.workspace === '1') {
      dragRef.current = { mode: 'pan', sx: e.clientX, sy: e.clientY, origPan: { ...pan } };
    }
  };

  const startDragElem = (e, sIdx, eIdx, mode, handle = '') => {
    e.stopPropagation();
    setOpenMenu(null);
    if (spaceDown || e.button === 1) return;
    setCurScreenIdx(sIdx);
    setSelElIdx(eIdx);
    const el = project.screens[sIdx].elements[eIdx];
    if (el.locked) return;
    setHistory(h => [...h.slice(-39), project]);
    setRedoStack([]);
    dragRef.current = { mode, handle, sIdx, eIdx, sx: e.clientX, sy: e.clientY, orig: { ...el } };
  };

  useEffect(() => {
    const onMove = (e) => {
      const d = dragRef.current;
      if (!d) return;
      if (d.mode === 'pan') {
        setPan({ x: d.origPan.x + (e.clientX - d.sx), y: d.origPan.y + (e.clientY - d.sy) });
        return;
      }
      const dx = Math.round((e.clientX - d.sx) / zoom);
      const dy = Math.round((e.clientY - d.sy) / zoom);
      const { orig, sIdx, eIdx } = d;

      if (d.mode === 'move') {
        let nx = orig.x + dx, ny = orig.y + dy;
        const newGuides = [];
        const scr = project.screens[sIdx];
        const snapX = [0, 240, 480], snapY = [0, 180, 360];
        scr.elements.forEach((o, idx) => {
          if (idx === eIdx) return;
          snapX.push(o.x, o.x + o.w / 2, o.x + o.w);
          snapY.push(o.y, o.y + o.h / 2, o.y + o.h);
        });
        for (const tx of snapX) {
          if (Math.abs(nx - tx) <= 4) { nx = tx; newGuides.push({ type: 'v', pos: tx, sIdx }); break; }
          if (Math.abs(nx + orig.w / 2 - tx) <= 4) { nx = Math.round(tx - orig.w / 2); newGuides.push({ type: 'v', pos: tx, sIdx }); break; }
          if (Math.abs(nx + orig.w - tx) <= 4) { nx = Math.round(tx - orig.w); newGuides.push({ type: 'v', pos: tx, sIdx }); break; }
        }
        for (const ty of snapY) {
          if (Math.abs(ny - ty) <= 4) { ny = ty; newGuides.push({ type: 'h', pos: ty, sIdx }); break; }
          if (Math.abs(ny + orig.h / 2 - ty) <= 4) { ny = Math.round(ty - orig.h / 2); newGuides.push({ type: 'h', pos: ty, sIdx }); break; }
          if (Math.abs(ny + orig.h - ty) <= 4) { ny = Math.round(ty - orig.h); newGuides.push({ type: 'h', pos: ty, sIdx }); break; }
        }
        setGuides(newGuides);
        updateElem(sIdx, eIdx, { x: nx, y: ny }, false);
      } else if (d.mode === 'resize') {
        let { x, y, w, h } = orig;
        if (d.handle.includes('e')) w = Math.max(8, orig.w + dx);
        if (d.handle.includes('s')) h = Math.max(4, orig.h + dy);
        if (d.handle.includes('w')) { const nw = Math.max(8, orig.w - dx); x = orig.x + (orig.w - nw); w = nw; }
        if (d.handle.includes('n')) { const nh = Math.max(4, orig.h - dy); y = orig.y + (orig.h - nh); h = nh; }
        updateElem(sIdx, eIdx, { x, y, w, h }, false);
      }
    };
    const onUp = () => { if (dragRef.current) { dragRef.current = null; setGuides([]); } };
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    return () => { window.removeEventListener('mousemove', onMove); window.removeEventListener('mouseup', onUp); };
  }, [zoom, project, updateElem]);

  const onWheel = (e) => {
    if (e.ctrlKey || e.metaKey) {
      e.preventDefault();
      setZoom(z => Math.min(3, Math.max(0.4, +(z - e.deltaY * 0.0015).toFixed(2))));
    } else {
      setPan(p => ({ x: p.x - e.deltaX, y: p.y - e.deltaY }));
    }
  };

  const downloadBlob = (filename, blob) => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
  };

  const downloadText = (filename, content) => {
    downloadBlob(filename, new Blob([content], { type: 'text/plain' }));
  };

  const exportZipBundle = async () => {
    if (!window.JSZip) {
      alert('JSZip not loaded; downloading individual files.');
      return;
    }
    const zip = new window.JSZip();
    const slug = (project.cfg.name || 'custom_theme').replace(/\s+/g, '_');
    zip.file(`.rockbox/themes/${slug}.cfg`, generateCfg(project));
    project.screens.forEach(s => {
      zip.file(`.rockbox/wps/${slug}.${s.ext}`, generateSkinFile(s, project));
      s.elements.filter(e => !e.hidden && e.type === 'sprite').forEach(sp => {
        const bmpBytes = generateSpriteBmp(sp);
        zip.file(`.rockbox/wps/${slug}/${sp.bmp || 'Sprite.bmp'}`, bmpBytes);
      });
    });
    // Generate real RB12 .fnt files
    const uiFnt = generateRockboxFntBinary('Inter', project.cfg.uiFontPx || 20, '400');
    zip.file(`.rockbox/fonts/${project.cfg.uiFontFile || '20-Inter.fnt'}`, uiFnt);
    (project.fonts || []).forEach(f => {
      const fnt = generateRockboxFntBinary(f.family || 'Inter', f.px || 18, f.weight || '400');
      zip.file(`.rockbox/fonts/${f.file}`, fnt);
    });
    if (project.cfg.iconset && project.cfg.iconset !== '-') {
      zip.file(`.rockbox/icons/${project.cfg.iconset}`, generateIconsetBmp());
    }
    const blob = await zip.generateAsync({ type: 'blob' });
    downloadBlob(`${slug}_rockbox_theme.zip`, blob);
  };

  const uploadCustomTtf = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const buf = await file.arrayBuffer();
    const fam = file.name.replace(/\.[^.]+$/, '');
    try {
      const ff = new FontFace(fam, buf);
      await ff.load();
      document.fonts.add(ff);
      const nextId = Math.max(2, ...(project.fonts || []).map(f => f.id + 1));
      const fntName = `20-${fam}.fnt`;
      commitProject(p => ({
        ...p,
        fonts: [...(p.fonts || []), { id: nextId, file: fntName, px: 20, family: fam, weight: '400' }]
      }));
    } catch { alert('Failed to load TTF/OTF font'); }
    e.target.value = '';
  };

  const importProjectJson = (e) => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const parsed = JSON.parse(r.result);
        if (parsed.screens && parsed.cfg) {
          commitProject(parsed);
          setCurScreenIdx(0);
          setSelElIdx(0);
        }
      } catch { alert('Invalid Rockbox Theme Project JSON'); }
    };
    r.readAsText(f);
    e.target.value = '';
  };

  const alignSel = (mode) => {
    if (!selElem) return;
    if (mode === 'left') updateElem(curScreenIdx, selElIdx, { x: 0 });
    if (mode === 'hcenter') updateElem(curScreenIdx, selElIdx, { x: Math.round((TARGET_W - selElem.w) / 2) });
    if (mode === 'right') updateElem(curScreenIdx, selElIdx, { x: TARGET_W - selElem.w });
    if (mode === 'top') updateElem(curScreenIdx, selElIdx, { y: 0 });
    if (mode === 'vcenter') updateElem(curScreenIdx, selElIdx, { y: Math.round((TARGET_H - selElem.h) / 2) });
    if (mode === 'bottom') updateElem(curScreenIdx, selElIdx, { y: TARGET_H - selElem.h });
  };

  const isElemVisibleInSim = (el) => {
    if (el.hidden) return false;
    if (!sampleMode) return true;
    const c = el.cond || 'always';
    if (c === 'has_art') return simState.hasArt;
    if (c === 'no_art') return !simState.hasArt;
    if (c === 'hold') return simState.hold;
    if (c === 'no_hold') return !simState.hold;
    if (c === 'vol_popup') return simState.volPopup;
    if (c === 'charging') return simState.charging;
    if (c === 'playing') return simState.playing;
    return true;
  };

  const fontInfoForSlot = (fontId) => {
    if (fontId === 0) return { px: 14, family: 'monospace', weight: '400' };
    if (fontId === 1) return { px: project.cfg.uiFontPx || 20, family: 'Inter', weight: '400' };
    const found = (project.fonts || []).find(f => f.id === fontId);
    return found || { px: 18, family: 'Inter', weight: '400' };
  };

  const getInspectorCode = () => {
    if (rightTab === 'cfg') return generateCfg(project);
    const scr = project.screens.find(s => s.ext === rightTab);
    return scr ? generateSkinFile(scr, project) : '';
  };

  return (
    <div className="flex flex-col h-screen w-screen bg-[#1e1e1e] text-[#e5e5e5]">
      {/* Classic Desktop Menu Bar */}
      <div className="h-7 bg-[#202020] border-b border-[#333] flex items-center px-2 gap-1 text-xs relative z-50 shrink-0">
        <span className="font-bold text-[#f59e0b] px-2">RB Studio</span>
        {[
          { id: 'file', label: 'File', items: [
            ['New: Nugget Dark', () => { commitProject(PRESETS.nugget_dark); setOpenMenu(null); }],
            ['New: Classic Split (.sbs)', () => { commitProject(PRESETS.ipod_split); setOpenMenu(null); }],
            ['Import Project (.json)...', () => { fileInputRef.current.click(); setOpenMenu(null); }],
            ['Save Project (.json)', () => { downloadText('rockbox_theme_project.json', JSON.stringify(project, null, 2)); setOpenMenu(null); }],
            ['Upload TTF Font...', () => { fontInputRef.current.click(); setOpenMenu(null); }],
          ]},
          { id: 'edit', label: 'Edit', items: [
            ['Undo (Ctrl+Z)', () => { undo(); setOpenMenu(null); }],
            ['Redo (Ctrl+Y)', () => { redo(); setOpenMenu(null); }],
            ['Duplicate (Ctrl+D)', () => { duplicateSelected(); setOpenMenu(null); }],
            ['Delete (Del)', () => { deleteSelected(); setOpenMenu(null); }],
          ]},
          { id: 'view', label: 'View', items: [
            ['Toggle Sample Tags', () => { setSampleMode(v => !v); setOpenMenu(null); }],
            ['Zoom In', () => { setZoom(z => Math.min(3, +(z + 0.2).toFixed(2))); setOpenMenu(null); }],
            ['Zoom Out', () => { setZoom(z => Math.max(0.4, +(z - 0.2).toFixed(2))); setOpenMenu(null); }],
            ['Reset View', () => { setZoom(1.15); setPan({ x: 48, y: 44 }); setOpenMenu(null); }],
          ]},
          { id: 'export', label: 'Export', items: [
            ['Export Full Theme (.zip with .fnt + .bmp)', () => { exportZipBundle(); setOpenMenu(null); }],
            ['Download .cfg', () => { downloadText(`${project.cfg.name}.cfg`, generateCfg(project)); setOpenMenu(null); }],

                <>
                  <div className="space-y-1.5 pb-3 border-b border-[#3c3c3c]">
                    <div className="text-[11px] font-semibold uppercase tracking-wider text-[#999]">Align to 480×360</div>
                    <div className="grid grid-cols-6 gap-1">
                      {[['left','⇤'],['hcenter','↔'],['right','⇥'],['top','⤒'],['vcenter','↕'],['bottom','⤓']].map(([m, sym]) => (
                        <button key={m} onClick={() => alignSel(m)} className="py-1 bg-[#1e1e1e] hover:bg-[#383838] rounded text-xs">{sym}</button>
                      ))}
                    </div>
                  </div>

                  <div className="space-y-2 pb-3 border-b border-[#3c3c3c]">
                    <div className="text-[11px] font-semibold uppercase tracking-wider text-[#999]">Viewport & Condition</div>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="text-[10px] text-[#888]">ID / Label</label>
                        <input value={selElem.id} onChange={e => updateElem(curScreenIdx, selElIdx, { id: e.target.value })}
                          className="w-full bg-[#1e1e1e] border border-[#3c3c3c] rounded px-2 py-1 text-xs font-mono" />
                      </div>
                      <div>
                        <label className="text-[10px] text-[#888]">Condition (%Vd)</label>
                        <select value={selElem.cond || 'always'} onChange={e => updateElem(curScreenIdx, selElIdx, { cond: e.target.value })}
                          className="w-full bg-[#1e1e1e] border border-[#3c3c3c] rounded px-1.5 py-1 text-xs">
                          {COND_OPTIONS.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
                        </select>
                      </div>
                    </div>
                    <div className="grid grid-cols-4 gap-1.5">
                      {[['X','x'],['Y','y'],['W','w'],['H','h']].map(([lbl, k]) => (
                        <div key={k}>
                          <label className="text-[10px] text-[#888]">{lbl}</label>
                          <input type="number" value={selElem[k]} onChange={e => updateElem(curScreenIdx, selElIdx, { [k]: parseInt(e.target.value || 0, 10) })}
                            className="w-full bg-[#1e1e1e] border border-[#3c3c3c] rounded px-1.5 py-1 text-xs font-mono" />
                        </div>
                      ))}
                    </div>
                    {(selElem.type === 'rect' || selElem.type === 'viewport') && (
                      <label className="flex items-center gap-1.5 text-xs cursor-pointer pt-1">
                        <input type="checkbox" checked={!!selElem.backdropLayer} onChange={e => updateElem(curScreenIdx, selElIdx, { backdropLayer: e.target.checked })} className="accent-[#0d99ff]" />
                        Draw to Backdrop Layer (%VB)
                      </label>
                    )}
                  </div>

                  {(selElem.type === 'rect' || selElem.type === 'viewport' || selElem.type === 'progressbar' || selElem.type === 'ui_viewport') && (
                    <div className="space-y-2 pb-3 border-b border-[#3c3c3c]">
                      <div className="text-[11px] font-semibold uppercase tracking-wider text-[#999]">Colors (%Vf / %Vb / %dr)</div>
                      {selElem.type === 'rect' ? (
                        <div className="flex gap-2 items-center">
                          <input type="color" value={selElem.fill || '#1B202B'} onChange={e => updateElem(curScreenIdx, selElIdx, { fill: e.target.value })} className="w-8 h-8 bg-transparent border-0 p-0 cursor-pointer" />
                          <input value={selElem.fill || ''} onChange={e => updateElem(curScreenIdx, selElIdx, { fill: e.target.value })} className="flex-1 bg-[#1e1e1e] border border-[#3c3c3c] rounded px-2 py-1 text-xs font-mono" />
                        </div>
                      ) : (
                        <div className="grid grid-cols-2 gap-2">
                          <div>
                            <label className="text-[10px] text-[#888]">Foreground (%Vf)</label>
                            <input value={selElem.fg || '-'} onChange={e => updateElem(curScreenIdx, selElIdx, { fg: e.target.value })} className="w-full bg-[#1e1e1e] border border-[#3c3c3c] rounded px-2 py-1 text-xs font-mono" />
                          </div>
                          <div>
                            <label className="text-[10px] text-[#888]">Background (%Vb)</label>
                            <input value={selElem.bg || '-'} onChange={e => updateElem(curScreenIdx, selElIdx, { bg: e.target.value })} className="w-full bg-[#1e1e1e] border border-[#3c3c3c] rounded px-2 py-1 text-xs font-mono" />
                          </div>
                        </div>
                      )}
                    </div>
                  )}

                  {selElem.type === 'sprite' && (
                    <div className="space-y-2 pb-3 border-b border-[#3c3c3c]">
                      <div className="text-[11px] font-semibold uppercase tracking-wider text-[#999]">Bitmap Sprite (%xl / %xd)</div>
                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <label className="text-[10px] text-[#888]">BMP Filename</label>
                          <input value={selElem.bmp || ''} onChange={e => updateElem(curScreenIdx, selElIdx, { bmp: e.target.value })} className="w-full bg-[#1e1e1e] border border-[#3c3c3c] rounded px-2 py-1 text-xs font-mono" />
                        </div>
                        <div>
                          <label className="text-[10px] text-[#888]">Subimages</label>
                          <input type="number" min="1" value={selElem.subimages || 1} onChange={e => updateElem(curScreenIdx, selElIdx, { subimages: Math.max(1, parseInt(e.target.value || 1, 10)) })} className="w-full bg-[#1e1e1e] border border-[#3c3c3c] rounded px-2 py-1 text-xs font-mono" />
                        </div>
                      </div>
                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <label className="text-[10px] text-[#888]">Driver Tag</label>
                          <input value={selElem.tag || '%bl'} onChange={e => updateElem(curScreenIdx, selElIdx, { tag: e.target.value })} className="w-full bg-[#1e1e1e] border border-[#3c3c3c] rounded px-2 py-1 text-xs font-mono" />
                        </div>
                        <div>
                          <label className="text-[10px] text-[#888]">Generator Preset</label>
                          <select value={selElem.presetKind || 'battery'} onChange={e => updateElem(curScreenIdx, selElIdx, { presetKind: e.target.value })} className="w-full bg-[#1e1e1e] border border-[#3c3c3c] rounded px-1.5 py-1 text-xs">
                            <option value="battery">Battery</option>
                            <option value="play">Play/Pause</option>
                            <option value="custom">Custom</option>
                          </select>
                        </div>
                      </div>
                    </div>
                  )}

                  {(selElem.type === 'viewport' || selElem.type === 'ui_viewport') && (
                    <div className="space-y-2 pb-3 border-b border-[#3c3c3c]">
                      <div className="text-[11px] font-semibold uppercase tracking-wider text-[#999]">Font & Format</div>
                      <div>
                        <label className="text-[10px] text-[#888]">Font Slot (%Fl)</label>
                        <select value={selElem.fontId ?? 1} onChange={e => updateElem(curScreenIdx, selElIdx, { fontId: parseInt(e.target.value, 10) })}
                          className="w-full bg-[#1e1e1e] border border-[#3c3c3c] rounded px-2 py-1 text-xs">
                          {(project.fonts || []).map(f => <option key={f.id} value={f.id}>{f.id}: {f.file} ({f.px}px)</option>)}
                          <option value={1}>1: Theme UI Font</option>
                          <option value={0}>0: Sysfixed</option>
                        </select>
                      </div>
                      {selElem.type === 'viewport' && (
                        <>
                          <div className="grid grid-cols-2 gap-2">
                            <div>
                              <label className="text-[10px] text-[#888]">Align</label>
                              <select value={selElem.align || 'l'} onChange={e => updateElem(curScreenIdx, selElIdx, { align: e.target.value })}
                                className="w-full bg-[#1e1e1e] border border-[#3c3c3c] rounded px-2 py-1 text-xs">
                                <option value="l">%al Left</option>
                                <option value="c">%ac Center</option>
                                <option value="r">%ar Right</option>
                              </select>
                            </div>
                            <div className="flex items-end pb-1">
                              <label className="flex items-center gap-1.5 text-xs cursor-pointer">
                                <input type="checkbox" checked={!!selElem.scroll} onChange={e => updateElem(curScreenIdx, selElIdx, { scroll: e.target.checked })} className="accent-[#0d99ff]" />
                                Scroll (%s)
                              </label>
                            </div>
                          </div>
                          <div>
                            <label className="text-[10px] text-[#888]">Format Line</label>
                            <input value={selElem.text || ''} onChange={e => updateElem(curScreenIdx, selElIdx, { text: e.target.value })}
                              className="w-full bg-[#1e1e1e] border border-[#3c3c3c] rounded px-2 py-1 text-xs font-mono" />
                          </div>
                          <div className="flex flex-wrap gap-1 pt-1">
                            {ROCKBOX_TAGS.map(t => (
                              <button key={t.tag} onClick={() => updateElem(curScreenIdx, selElIdx, { text: (selElem.text || '') + t.tag })}
                                className="px-1.5 py-0.5 bg-[#1e1e1e] hover:bg-[#383838] border border-[#3c3c3c] rounded text-[10px] font-mono text-[#93c5fd]">
                                {t.label}
                              </button>
                            ))}
                          </div>
                        </>
                      )}
                    </div>
                  )}

                  <div className="grid grid-cols-2 gap-2">
                    <button onClick={duplicateSelected} className="py-1.5 bg-[#383838] hover:bg-[#444] rounded text-xs font-medium">Duplicate</button>
                    <button onClick={deleteSelected} className="py-1.5 bg-[#7f1d1d] hover:bg-[#991b1b] text-white rounded text-xs font-medium">Delete</button>
                  </div>
                </>
              ) : (
                <div className="text-xs text-[#777]">Select an element on the 480×360 artboard or Layers panel.</div>
              )}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
